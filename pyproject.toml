[project]
name = "earfish"
version = "0.1.0"
description = "Live Chinese subtitles and a meeting transcript for English speech."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mlx-qwen3-asr>=0.4.4",
    "numpy",
    "openai>=3.46",
    "pyobjc-framework-AVFoundation",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "python-dotenv",
    "rumps>=0.4",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
earfish = "earfish.cli:main"
earfish-app = "earfish.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earfish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
